<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="160" rx="12" fill="url(#bg)" stroke="#1f2937" stroke-width="2" />

  <!-- Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4">
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="200" y1="0" x2="200" y2="160" />
    <line x1="450" y1="0" x2="450" y2="160" />
    <line x1="650" y1="0" x2="650" y2="160" />
  </g>

  <!-- Left: Marine Radar CAN Node Sweep -->
  <g transform="translate(100, 80)">
    <circle r="55" fill="url(#radarGlow)" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.6" />
    <circle r="38" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.5" />
    <circle r="20" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.4" />
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.4" />
    <!-- Animated Blip -->
    <circle cx="22" cy="-18" r="3.5" fill="#f59e0b">
      <animate attributeName="opacity" values="1;0.1;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <!-- Rotating Radar Beam -->
    <g>
      <path d="M 0 0 L 55 0 A 55 55 0 0 1 38.8 38.8 Z" fill="#00f2fe" fill-opacity="0.3" />
      <line x1="0" y1="0" x2="55" y2="0" stroke="#00f2fe" stroke-width="2" />
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.5s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- Center: CAN 2.0B & Rover Telemetry Waveform -->
  <g transform="translate(200, 0)">
    <text x="15" y="28" fill="#00f2fe" font-family="monospace" font-size="12" font-weight="bold">
      CAN 2.0B @ 125 kbps | ROVER AI VISION & GPIO PWM TELEMETRY
    </text>
    <path d="M 15 90 L 50 90 L 50 55 L 85 55 L 85 115 L 110 115 L 110 90 L 155 90 L 155 60 L 195 60 L 195 90 L 240 90 L 240 50 L 265 50 L 265 120 L 295 120 L 295 90 L 350 90 L 350 60 L 390 60 L 390 90 L 430 90" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="12 6">
      <animate attributeName="stroke-dashoffset" from="180" to="0" dur="2.5s" repeatCount="indefinite" />
    </path>
    <text x="15" y="145" fill="#94a3b8" font-family="monospace" font-size="11">
      NODES: ARM LPC21xx | Raspberry Pi 5 | ESP32 | STM32 | Linux Bare-Metal
    </text>
  </g>

  <!-- Right: Status Indicators -->
  <g transform="translate(655, 30)" font-family="monospace" font-size="11">
    <rect x="0" y="0" width="125" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="17" fill="#ecfdf5">ROVER: ONLINE</text>

    <rect x="0" y="38" width="125" height="26" rx="4" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1" />
    <circle cx="14" cy="51" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="55" fill="#e0f2fe">CAN BUS: ACTIVE</text>

    <rect x="0" y="76" width="125" height="26" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
    <circle cx="14" cy="89" r="4" fill="#f59e0b">
      <animate attributeName="opacity" values="1;0.3;1" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="93" fill="#fef3c7">BMS: NOMINAL</text>
  </g>
</svg>
